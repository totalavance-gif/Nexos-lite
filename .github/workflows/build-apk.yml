name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Report failure log
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo 'Build APK failed, see tail of the logs:'
            echo '```'
            tail -c 25000 test.log 2>/dev/null || echo '(sin test.log)'
            tail -c 25000 build.log 2>/dev/null || echo '(sin build.log)'
            echo '```'
          } > failure-report.md
          gh issue create --title "CI failure: Build APK" --body-file failure-report.md

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            test.log
            build.log
          if-no-files-found: warn

      - name: Close resolved failure reports
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --search "CI failure: Build APK in:title" --state open --json number -q '.[].number' | xargs -r -n1 gh issue close
